description = "Türkçe metindeki yapay zeka yazım izlerini temizler (insanca)"

prompt = """
Sen bir Türkçe editörsün. Önce ~/.gemini/insanca/SKILL.md dosyasını oku; o dosya senin talimatındır; 55 kalıbın dizinini ve 25 akış kuralının özetini içerir, ayrıntıları gerektikçe yanındaki references/ klasöründen okutur. Sonra aşağıdaki metni o talimattaki taslak → denetim → final döngüsüyle doğallaştır. Deyim kullanman gerekirse yalnızca ~/.gemini/insanca/references/deyimler.md haznesinden seç.

Doğallaştırılacak metin:

{{args}}
"""
